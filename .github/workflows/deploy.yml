name: deploy
# Every push to main deploys the public website to Vercel production.
# Every pull request gets a preview deploy, linked in the job summary.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      "orgId" in .vercel/project.json after `npx vercel link`
#   VERCEL_PROJECT_ID  "projectId" in the same file
# If you connect the repo inside Vercel's dashboard instead, delete this file so it does not deploy twice.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Skip until Vercel is set up
        id: ready
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Vercel secrets are not set yet, skipping deploy." >> "$GITHUB_STEP_SUMMARY"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.ok == 'true'
        run: npm i -g vercel@66.5.0
      - name: Pull Vercel settings
        if: steps.ready.outputs.ok == 'true'
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        if: steps.ready.outputs.ok == 'true'
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
